# Limine boot configuration for Sirius OS.
# Installed to the ESP at /boot/limine/limine.conf by tools/mkimage.sh.

timeout: 0
verbose: yes
# Mirror bootloader output to COM1 so CI and headless runs can see boot failures.
serial: yes

# The normal boot: the kernel mounts the SIRIUS-ROOT partition and runs
# /bin/init from it -- which is also the M3 exit test.
/Sirius OS
    protocol: limine
    path: boot():/boot/sirius.elf

/Sirius OS (verbose serial)
    protocol: limine
    path: boot():/boot/sirius.elf
    cmdline: loglevel=debug console=serial

# Deliberate faults, to exercise the exception handlers. See run_fault_test().
/Sirius OS (fault test: page fault)
    protocol: limine
    path: boot():/boot/sirius.elf
    cmdline: loglevel=debug faulttest=pf

/Sirius OS (fault test: double fault via stack overflow)
    protocol: limine
    path: boot():/boot/sirius.elf
    cmdline: loglevel=debug faulttest=df

/Sirius OS (fault test: general protection fault)
    protocol: limine
    path: boot():/boot/sirius.elf
    cmdline: loglevel=debug faulttest=gp

/Sirius OS (memory selftests)
    protocol: limine
    path: boot():/boot/sirius.elf
    cmdline: loglevel=info selftest

# User programs that misbehave on purpose: each must be killed (or refused)
# without disturbing the kernel or the tickers running beside them.
/Sirius OS (user fault test)
    protocol: limine
    path: boot():/boot/sirius.elf
    cmdline: loglevel=info
    module_path: boot():/boot/probe.elf
    module_string: null
    module_path: boot():/boot/probe.elf
    module_string: kernel
    module_path: boot():/boot/probe.elf
    module_string: privileged
    module_path: boot():/boot/probe.elf
    module_string: invalid
    module_path: boot():/boot/probe.elf
    module_string: badptr
    module_path: boot():/boot/ticker.elf
    module_string: t1
    module_path: boot():/boot/ticker.elf
    module_string: t2
    module_path: boot():/boot/ticker.elf
    module_string: t3
    module_path: boot():/boot/ticker.elf
    module_string: t4
    module_path: boot():/boot/ticker.elf
    module_string: t5
    module_path: boot():/boot/ticker.elf
    module_string: t6

# The M2 exit test: two user programs on different cores, output interleaved.
# Boot modules take the place of /bin/init.
/Sirius OS (two tickers)
    protocol: limine
    path: boot():/boot/sirius.elf
    module_path: boot():/boot/ticker.elf
    module_string: alpha
    module_path: boot():/boot/ticker.elf
    module_string: beta

# The desktop: siriusd takes the place of /bin/init, maps the framebuffer and
# draws the panel, the windows and the applications in them. `make run`
# boots this entry.
/Sirius OS (desktop)
    protocol: limine
    path: boot():/boot/sirius.elf
    resolution: 1920x1080x32
    cmdline: init=/bin/siriusd

# libwayland's own test suite, run by /bin/wltest: the M6 exit test. Needs
# the wayland port in the image (./tools/ports.sh add wayland).
/Sirius OS (wayland test suite)
    protocol: limine
    path: boot():/boot/sirius.elf
    cmdline: init=/bin/wltest

# A real machine, booted from a USB stick (tools/write-usb.sh): the root
# filesystem comes from the stick in the bootloader's hands, into memory --
# the kernel has no driver for USB storage, and leaves the machine's own
# disks alone. Changes last until the machine is switched off. At the
# display's own resolution.
/Sirius OS (live: from memory)
    protocol: limine
    path: boot():/boot/sirius.elf
    cmdline: init=/bin/siriusd
    module_path: boot():/boot/rootfs.img
    module_string: rootfs

# The same, with the kernel's log on the screen until the desktop starts:
# for a machine with no serial port, when something goes wrong.
/Sirius OS (live, with the kernel log on screen)
    protocol: limine
    path: boot():/boot/sirius.elf
    cmdline: init=/bin/siriusd console=fb loglevel=debug
    module_path: boot():/boot/rootfs.img
    module_string: rootfs
